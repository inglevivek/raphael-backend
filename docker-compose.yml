services:
  postgres:
    image: postgres:18-alpine
    container_name: raphael_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raphael-db
      POSTGRES_USER: raphael-admin
      POSTGRES_PASSWORD: viktor911
    ports:
      - "5433:5432"   # 👈 Changed host port to avoid conflict
    networks:
      - raphael_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raphael-admin"]
      interval: 10s
      timeout: 5s
      retries: 5
   
  # Redis 8 Cache
  redis:
    image: redis:8-alpine
    container_name: raphael_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      # Persistent cache data
      - redis_data:/data
      # Optional: Mount custom Redis config
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - raphael_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  # Named volumes (managed by Docker)
  postgres_data:
  redis_data:


networks:
  raphael_network:
    driver: bridge
