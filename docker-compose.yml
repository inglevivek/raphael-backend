services:
  # PostgreSQL 18 Database
  postgres:
    image: postgres:18-alpine
    container_name: raphael_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raphael_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistent database data
      - postgres_data:/var/lib/raphael/postgresql/data
      # Optional: Mount initialization scripts
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Optional: Mount backup directory
      - ./docker/postgres/backups:/backups
    networks:
      - raphael_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 8 Cache
  redis:
    image: redis:8-alpine
    container_name: raphael_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # Persistent cache data
      - redis_data:/data
      # Optional: Mount custom Redis config
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - raphael_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  # Named volumes (managed by Docker)
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  raphael_network:
    driver: bridge
